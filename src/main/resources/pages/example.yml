# Example page. Copy this file to <plugin-folder>/pages/ and rename it to
# <page-id>.yml, or run /lumina create <id> to start from an empty page.
schema-version: 1
title: 'Example HUD'
scale: 1.0
persistent: false
layers:
  - id: background
    depth: 0
    interactive: false
    nodes:
      - id: panel
        type: shape
        bounds:
          x: 20
          y: 20
          width: 240
          height: 100
        anchor: TOP_LEFT
        visible: true
        material: minecraft:gray_concrete
        corner-radius: 8
        style:
          background: 0
          accent: -1598038790
          opacity: 1.0
          shadow: false
          glow: 0
          billboard: CENTER
  - id: main
    depth: 1
    interactive: true
    nodes:
      - id: heading
        type: text
        bounds:
          x: 36
          y: 36
          width: 200
          height: 28
        anchor: TOP_LEFT
        visible: true
        text: '<gradient:#7dd3fc:#a78bfa><bold>LuminaUI</bold></gradient>'
        scale: 0.5
        line-width: 200
        style:
          background: 0
          accent: -1
          opacity: 1.0
          shadow: true
          glow: 0
          billboard: CENTER
      - id: subtitle
        type: text
        bounds:
          x: 36
          y: 68
          width: 200
          height: 40
        anchor: TOP_LEFT
        visible: true
        text: '<gray>A declarative UI runtime for Paper and Folia.'
        scale: 0.35
        line-width: 200
        style:
          background: 0
          accent: -1
          opacity: 1.0
          shadow: true
          glow: 0
          billboard: CENTER
